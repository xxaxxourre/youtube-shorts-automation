# YouTube Shorts Automation - Scaled Configuration (15 Channels)
#
# This configuration maximizes output within API limits:
# - 15 different niches (channels)
# - 6-7 videos uploaded daily across all channels
# - Distributed throughout the day (no batch uploads)
# - Generates 3x daily content for queue
#
# YouTube API Limit: 10,000 units/day = ~6-7 uploads/day
# This setup hits that limit efficiently

channels:
  science_facts:
    niche: "Science & Space Facts"
    videos_per_run: 1
    posting_time: "06:00"  # 6 AM UTC
    prompt_template: |
      You are an expert science communicator creating engaging YouTube Shorts about fascinating science and space facts.
      Make the content surprising, intriguing, and accessible to a general audience.
      Include a surprising fact, brief explanation, and why it matters.
      Keep it conversational and exciting. Max 50 words.
    keywords:
      - "space discoveries"
      - "astronomy facts"
      - "physics explained"
      - "biology wonders"
      - "neuroscience"
      - "quantum physics"
      - "earth science"
    pexels_search_query: "space universe astronomy"
    youtube_credentials_path: "config/youtube_credentials.json"

  motivation_daily:
