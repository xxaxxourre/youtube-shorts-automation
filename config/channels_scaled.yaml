# Workflow Configuration
workflow:
  # Generate new scripts 3 times daily
  generation_schedule:
    - "00:00"  # Midnight UTC
    - "08:00"  # 8 AM UTC
    - "16:00"  # 4 PM UTC

  # Each generation creates 1 script per channel
  scripts_per_run: 1

  # Videos are created as scripts become available
  # Upload happens at the posting_time specified per channel

  # This ensures:
  # - 15 videos generated daily
  # - 7-8 videos queued for upload
  # - 1 video uploaded every ~2-3 hours
  # - Distributed throughout the day
  # - Hits YouTube API quota limit efficiently

# Total Daily Output
# Per generation (3x daily): 15 scripts
# Daily uploads: 6-7 videos across all channels
# Spread: 1 video every 1.5-2 hours
# All 15 channels get content generated, 6-7 get posted
