<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .timestamp {
            color: #666;
            font-size: 0.9em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid #2a5298;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        .stat-card h3 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .stat-value {
            font-weight: bold;
            color: #2a5298;
            font-size: 1.1em;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            transition: width 0.3s;
        }
        .section-title {
            font-size: 1.5em;
            color: white;
            margin: 30px 0 15px 0;
            font-weight: bold;
        }
        .uploads-list {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .upload-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .upload-item:hover {
            background: #f9f9f9;
        }
        .upload-item:last-child {
            border-bottom: none;
        }
        .upload-info {
            flex: 1;
        }
        .upload-channel {
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        .upload-time {
            font-size: 0.85em;
            color: #999;
        }
        .upload-link {
            background: #2a5298;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        .upload-link:hover {
            background: #1e3c72;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .refresh-button {
            background: #2a5298;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .refresh-button:hover {
            background: #1e3c72;
        }
        .last-update {
            text-align: right;
            color: white;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 YouTube Shorts Automation Dashboard</h1>
            <p class="timestamp">Real-time metrics for multi-channel automation</p>
        </header>

        <button class="refresh-button" onclick="refreshStats()">🔄 Refresh Stats</button>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <p style="color: #999;">Loading...</p>
            </div>
        </div>

        <div class="section-title">📤 Recent Uploads</div>
        <div class="uploads-list" id="uploadsList">
            <div style="padding: 20px; text-align: center; color: #999;">
                Loading uploads...
            </div>
        </div>

        <div class="last-update" id="lastUpdate"></div>
    </div>

    <script>
        function formatTime(isoTime) {
            const date = new Date(isoTime);
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function refreshStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    const grid = document.getElementById('statsGrid');
                    grid.innerHTML = '';

                    for (const [channel, stats] of Object.entries(data)) {
                        const card = document.createElement('div');
                        card.className = 'stat-card';
                        card.innerHTML = `
                            <h3>${channel.replace(/_/g, ' ').toUpperCase()}</h3>
                            <div class="stat-row">
                                <span class="stat-label">Scripts Generated</span>
                                <span class="stat-value">${stats.scripts_total}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Videos Created</span>
                                <span class="stat-value">${stats.videos_total}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Uploaded to YouTube</span>
                                <span class="stat-value">${stats.uploads_total}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Last 24h Uploads</span>
                                <span class="stat-value">${stats.uploads_24h}</span>
                            </div>
                            <div class="stat-row">
                                <span class="stat-label">Completion Rate</span>
                                <span class="stat-value">${stats.completion_rate}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${stats.completion_rate}%"></div>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                })
                .catch(e => console.error('Error fetching stats:', e));

            fetch('/api/uploads')
                .then(r => r.json())
                .then(data => {
                    const list = document.getElementById('uploadsList');
                    if (data.length === 0) {
                        list.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No uploads yet</div>';
                        return;
                    }

                    list.innerHTML = data.map(u => `
                        <div class="upload-item">
                            <div class="upload-info">
                                <div class="upload-channel">${u.channel.replace(/_/g, ' ').toUpperCase()}</div>
                                <div class="upload-time">${formatTime(u.time)}</div>
                            </div>
                            <a href="${u.url}" target="_blank" class="upload-link">View on YouTube</a>
                        </div>
                    `).join('');
                })
                .catch(e => console.error('Error fetching uploads:', e));

            document.getElementById('lastUpdate').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        // Initial load and auto-refresh every 5 seconds
        refreshStats();
        setInterval(refreshStats, 5000);
    </script>
</body>
</html>
