name: Upload Videos (Distributed Throughout Day)

on:
  schedule:
    # Upload videos distributed throughout the day (every 2 hours)
    - cron: '0 0 * * *'   # Midnight
    - cron: '0 2 * * *'   # 2 AM
    - cron: '0 4 * * *'   # 4 AM
    - cron: '0 6 * * *'   # 6 AM
    - cron: '0 8 * * *'   # 8 AM
    - cron: '0 10 * * *'  # 10 AM
    - cron: '0 12 * * *'  # Noon
    - cron: '0 14 * * *'  # 2 PM
    - cron: '0 16 * * *'  # 4 PM
    - cron: '0 18 * * *'  # 6 PM
    - cron: '0 20 * * *'  # 8 PM
    - cron: '0 22 * * *'  # 10 PM
  workflow_dispatch:

jobs:
  create_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install FFmpeg
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create videos from queue
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python << 'PYTHON_SCRIPT'
import os
import sqlite3
from datetime import datetime
from src.video_creator import create_videos

# Get current hour (UTC)
current_hour = datetime.utcnow().hour

# Map each hour to a channel rotation
channel_map = {
            0: "food_recipes",
            1: "food_recipes",
            2: "travel_adventures",
            3: "travel_adventures",
            4: "art_creativity",
            5: "art_creativity",
            6: "science_facts",
            7: "motivation_daily",
            8: "motivation_daily",
            9: "life_hacks",
            10: "life_hacks",
            11: "education_learning",
            12: "history_facts",
            13: "finance_tips",
            14: "business_growth",
            15: "entertainment_pop_culture",
            16: "tech_trends",
            17: "health_wellness",
            18: "health_wellness",
            19: "sports_fitness",
            20: "personal_finance",
            21: "psychology_insights",
            22: "environment_sustainability",
            23: "environment_sustainability",
          }

channel = channel_map.get(current_hour, "science_facts")
print(f"Current UTC hour: {current_hour}")
print(f"Creating videos for channel: {channel}")

# Load config
import yaml
with open("config/channels_scaled.yaml") as f:
    config = yaml.safe_load(f)

channel_config = config["channels"][channel]

# Create videos from pending scripts
num_created = create_videos(
    channel=channel,
    config=channel_config,
    num_videos=1  # Create 1 video per upload cycle
)

print(f"Created {num_created} videos for {channel}")
PYTHON_SCRIPT

      - name: Upload videos (1 per channel per cycle)
        env:
          GOOGLE_APPLICATION_CREDENTIALS_DATA: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          # Write service account credentials
          echo "$GOOGLE_APPLICATION_CREDENTIALS_DATA" > /tmp/credentials.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/credentials.json

          python << 'PYTHON_SCRIPT'
import os
import sqlite3
from datetime import datetime
from src.youtube_uploader import upload_videos

# Get current hour (UTC)
current_hour = datetime.utcnow().hour

# Same channel rotation as above
channel_map = {
            0: "food_recipes",
            1: "food_recipes",
            2: "travel_adventures",
            3: "travel_adventures",
            4: "art_creativity",
            5: "art_creativity",
            6: "science_facts",
            7: "motivation_daily",
            8: "motivation_daily",
            9: "life_hacks",
            10: "life_hacks",
            11: "education_learning",
            12: "history_facts",
            13: "finance_tips",
            14: "business_growth",
            15: "entertainment_pop_culture",
            16: "tech_trends",
            17: "health_wellness",
            18: "health_wellness",
            19: "sports_fitness",
            20: "personal_finance",
            21: "psychology_insights",
            22: "environment_sustainability",
            23: "environment_sustainability",
          }

channel = channel_map.get(current_hour, "science_facts")
print(f"Uploading to channel: {channel}")

# Load config
import yaml
with open("config/channels_scaled.yaml") as f:
    config = yaml.safe_load(f)

channel_config = config["channels"][channel]

# Upload 1 video
num_uploaded = upload_videos(
    channel=channel,
    config=channel_config,
    num_videos=1
)

print(f"Uploaded {num_uploaded} videos to {channel}")
PYTHON_SCRIPT

      - name: Log upload metrics
        if: always()
        run: |
          echo "Upload metrics:"
          sqlite3 data/generated_scripts.db "SELECT channel, COUNT(*) as uploaded FROM uploads WHERE created_at > datetime('now', '-1 day') GROUP BY channel ORDER BY uploaded DESC LIMIT 15;"

      - name: Commit & push updates
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [[ -n $(git status -s) ]]; then
            git add data/
            git commit -m "Auto: Update uploads [$(date -u +'%H:%M UTC')]"
            git push
          fi
